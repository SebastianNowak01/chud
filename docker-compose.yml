services:
  app:
    container_name: chud
    image: chud
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2137:2137"
    environment:
      API_PORT: 2137
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      JWT_SECRET: dev-only-jwt-secret-change-me-in-prod
      JWT_EXPIRY_HOURS: 24
      ADMIN_USER: admin
      ADMIN_PASSWORD: dev-admin-pass
      DATABASE_URL: postgres://chud:chud@db:5432/chud?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    container_name: chud-db
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: chud
      POSTGRES_PASSWORD: chud
      POSTGRES_DB: chud
    volumes:
      - chud-db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U chud -d chud" ]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  chud-db:
